<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Women's Fashion — SANJHH BY AM</title>
  <meta name="description" content="Shop the SANJHH BY AM collection — women's dresses, jumpsuits, co-ord sets and ethnic occasion wear. Filter by size, colour, price and occasion.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="siteChrome"></div>

  <main class="container">
    <div class="shop-head">
      <span class="kicker" id="shopKicker">The Collection</span>
      <h1 id="shopTitle">All Pieces</h1>
    </div>

    <div class="shop-layout">
      <aside class="filters" id="filtersPanel" aria-label="Filters">
        <div style="display:none;justify-content:space-between;align-items:center;margin-bottom:8px" id="filtersMobileHead">
          <strong style="letter-spacing:2px;font-size:13px">FILTERS</strong>
          <button class="btn sm ghost" id="closeFilters">Done</button>
        </div>
        <div id="filterGroups"></div>
        <button class="clear" id="clearFilters">Clear all filters</button>
      </aside>

      <div>
        <div class="toolbar">
          <button class="btn sm ghost filter-toggle" id="openFilters">Filters</button>
          <span class="count" id="resultCount"></span>
          <select id="sortSelect" aria-label="Sort products">
            <option value="featured">Sort: Featured</option>
            <option value="newest">Newest</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
          </select>
        </div>
        <div class="grid" id="productGrid">
          <div class="skeleton" style="aspect-ratio:3/4"></div>
          <div class="skeleton" style="aspect-ratio:3/4"></div>
          <div class="skeleton" style="aspect-ratio:3/4"></div>
          <div class="skeleton" style="aspect-ratio:3/4"></div>
        </div>
        <div id="emptyBox"></div>
      </div>
    </div>
  </main>

  <div id="siteFooter"></div>
  <script src="js/app.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
