<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — SANJHH BY AM</title>
  <meta name="description" content="Get in touch with SANJHH BY AM — questions about orders, sizing, exchanges or anything else.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="siteChrome"></div>
  <main class="container">
    <div class="page-head" style="background:none"><span class="kicker">We're Listening</span><h1>Contact Us</h1></div>
    <div style="max-width:560px;margin:0 auto;padding:20px 0 70px">
      <form class="panel" id="contactForm">
        <p style="font-size:13.5px;color:var(--charcoal);margin-top:0">Questions about an order, sizing, or exchanges? Send us a message with your order ID (if you have one) and we'll get back to you during business hours.</p>
        <div class="field" style="margin-bottom:14px"><label for="c-name">Your Name</label><input id="c-name" required></div>
        <div class="field" style="margin-bottom:14px"><label for="c-email">Email</label><input id="c-email" type="email" required></div>
        <div class="field" style="margin-bottom:18px"><label for="c-msg">Message</label><textarea id="c-msg" rows="5" required></textarea></div>
        <button class="btn block" type="submit">Send Message</button>
        <div id="cMsgOut" style="margin-top:12px;font-size:13px"></div>
      </form>
    </div>
  </main>
  <div id="siteFooter"></div>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const out = document.getElementById('cMsgOut');
      try {
        const r = await fetch('/api/contact', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('c-name').value,
            email: document.getElementById('c-email').value,
            message: document.getElementById('c-msg').value,
          }),
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error);
        out.style.color = 'var(--gold)';
        out.textContent = 'Message sent — thank you! We will reply to your email.';
        e.target.reset();
      } catch (ex) {
        out.style.color = 'var(--rose)';
        out.textContent = ex.message || 'Could not send the message.';
      }
    });
  </script>
</body>
</html>
