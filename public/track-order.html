<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Order — SANJHH BY AM</title>
  <meta name="description" content="Track your SANJHH BY AM order using your order ID and the email or mobile number used at checkout.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="siteChrome"></div>
  <main class="container">
    <div class="page-head" style="background:none">
      <span class="kicker">Order Status</span>
      <h1>Track Your Order</h1>
    </div>
    <div style="max-width:560px;margin:0 auto;padding:30px 0 60px">
      <form class="panel" id="trackForm">
        <div class="field" style="margin-bottom:14px">
          <label for="t-id">Order ID</label>
          <input id="t-id" placeholder="e.g. SBAM-10001" required>
        </div>
        <div class="field" style="margin-bottom:18px">
          <label for="t-contact">Email or Mobile Number (used at checkout)</label>
          <input id="t-contact" required>
        </div>
        <button class="btn block" type="submit">Track Order</button>
        <div id="trackErr" style="color:var(--rose);font-size:13px;margin-top:12px;display:none"></div>
      </form>
      <div id="trackResult" style="margin-top:26px"></div>
    </div>
  </main>
  <div id="siteFooter"></div>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('trackForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('trackErr');
      const out = document.getElementById('trackResult');
      err.style.display = 'none'; out.innerHTML = '';
      const id = document.getElementById('t-id').value.trim();
      const contact = document.getElementById('t-contact').value.trim();
      let data;
      try {
        const r = await fetch(`/api/orders/track?orderId=${encodeURIComponent(id)}&contact=${encodeURIComponent(contact)}`);
        data = await r.json();
        if (!r.ok) throw new Error(data.error);
      } catch (ex) {
        err.textContent = ex.message || 'Order not found.';
        err.style.display = 'block';
        return;
      }
      const o = data.order;
      const flow = o.statusFlow, cur = flow.indexOf(o.status);
      const at = (s) => { const h = o.statusHistory.find(x => x.status === s); return h ? new Date(h.at).toLocaleString('en-IN', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : ''; };
      out.innerHTML = `<div class="panel">
        <h3 style="margin-bottom:6px">${SBAM.esc(o.orderId)}</h3>
        <p style="color:var(--taupe);font-size:13px;margin-top:0">Placed ${new Date(o.placedAt).toLocaleDateString('en-IN', {day:'numeric',month:'long',year:'numeric'})} · ${SBAM.esc(o.paymentMethod === 'cod' ? 'Cash on Delivery' : 'Paid Online')} · ${SBAM.money(o.total)}</p>
        ${o.shipping.awb ? `<p style="font-size:13px"><strong>Courier:</strong> ${SBAM.esc(o.shipping.courier || '—')} · <strong>AWB:</strong> ${SBAM.esc(o.shipping.awb)}</p>` : ''}
        <ul class="timeline" style="margin-top:18px">
          ${flow.map((s, i) => `<li class="${i < cur ? 'done' : i === cur ? 'current' : ''}"><span class="dot"></span>
            <div><div class="s">${s}</div>${at(s) ? `<div class="at">${at(s)}</div>` : ''}</div></li>`).join('')}
        </ul>
        <a class="btn sm ghost" target="_blank" href="/api/orders/${encodeURIComponent(o.orderId)}/invoice?key=${encodeURIComponent(data.accessKey)}">View Invoice</a>
      </div>`;
    });
  </script>
</body>
</html>
